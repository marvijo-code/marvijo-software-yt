<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Departures</title>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #111726;
    --panel-2: #0d1320;
    --line: #1e2740;
    --text: #e7ecf5;
    --muted: #8a97b5;
    --accent: #f5c518;
    --mono: "SF Mono", "Roboto Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --green: #22c55e;
    --blue: #3b82f6;
    --amber: #f59e0b;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -10%, #16203a 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 32px 20px 60px;
  }
  .wrap {
    max-width: 1120px;
    margin: 0 auto;
  }
  header.top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand .glyph {
    font-size: 30px;
    line-height: 1;
    filter: drop-shadow(0 0 10px rgba(245,197,24,.35));
  }
  .brand h1 {
    margin: 0;
    font-size: 26px;
    letter-spacing: .14em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .brand .sub {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .22em;
    text-transform: uppercase;
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  #filter {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 14px;
    width: 240px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #filter::placeholder { color: var(--muted); }
  #filter:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(245,197,24,.15);
  }
  #count {
    color: var(--accent);
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .04em;
    white-space: nowrap;
  }
  .board-shell {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.03);
  }
  table#board {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  #board thead th {
    text-align: left;
    padding: 15px 18px;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    background: rgba(255,255,255,.02);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    position: relative;
    transition: color .15s, background .15s;
  }
  #board thead th:hover { color: var(--text); background: rgba(255,255,255,.05); }
  #board thead th .arrow {
    margin-left: 8px;
    font-size: 10px;
    color: var(--accent);
    opacity: 0;
  }
  #board thead th[aria-sort] { color: var(--text); }
  #board thead th[aria-sort] .arrow { opacity: 1; }

  #board tbody td {
    padding: 14px 18px;
    border-bottom: 1px solid rgba(30,39,64,.6);
    font-size: 15px;
    vertical-align: middle;
  }
  #board tbody tr:last-child td { border-bottom: none; }
  #board tbody tr {
    transition: background .12s;
  }
  #board tbody tr:hover { background: rgba(245,197,24,.05); }

  .col-flight { width: 15%; }
  .col-city   { width: 30%; }
  .col-time   { width: 15%; }
  .col-gate   { width: 15%; }
  .col-status { width: 25%; }

  td.flight, td.time, td.gate {
    font-family: var(--mono);
    letter-spacing: .06em;
  }
  td.flight { color: var(--accent); font-weight: 600; }
  td.time { font-size: 17px; font-weight: 600; }
  td.city { font-weight: 500; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .chip::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }
  .chip[data-status="On Time"] {
    color: var(--green);
    background: rgba(34,197,94,.12);
    border-color: rgba(34,197,94,.3);
  }
  .chip[data-status="Boarding"] {
    color: var(--blue);
    background: rgba(59,130,246,.12);
    border-color: rgba(59,130,246,.3);
  }
  .chip[data-status="Delayed"] {
    color: var(--amber);
    background: rgba(245,158,11,.12);
    border-color: rgba(245,158,11,.3);
  }
  .chip[data-status="Cancelled"] {
    color: var(--red);
    background: rgba(239,68,68,.12);
    border-color: rgba(239,68,68,.3);
  }
  .empty td {
    text-align: center;
    color: var(--muted);
    padding: 40px 18px;
    font-size: 14px;
  }
  @media (max-width: 640px) {
    #board thead th, #board tbody td { padding: 12px 12px; font-size: 13px; }
    #filter { width: 100%; }
    .controls { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="glyph">&#9992;&#65039;</span>
      <div>
        <h1>Departures</h1>
        <p class="sub">Live flight information</p>
      </div>
    </div>
    <div class="controls">
      <span id="count">0 flights</span>
      <input id="filter" type="text" placeholder="Filter flight or city..." autocomplete="off" aria-label="Filter flights">
    </div>
  </header>

  <div class="board-shell">
    <table id="board">
      <thead>
        <tr>
          <th data-key="flight" class="col-flight">Flight<span class="arrow"></span></th>
          <th data-key="city" class="col-city">City<span class="arrow"></span></th>
          <th data-key="time" class="col-time">Time<span class="arrow"></span></th>
          <th data-key="gate" class="col-gate">Gate<span class="arrow"></span></th>
          <th data-key="status" class="col-status">Status<span class="arrow"></span></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script src="data.js"></script>
<script>
(function () {
  var tbody = document.querySelector("#board tbody");
  var countEl = document.getElementById("count");
  var filterEl = document.getElementById("filter");
  var headers = Array.prototype.slice.call(document.querySelectorAll("#board thead th"));

  var sortKey = "time";
  var sortDir = 1; // 1 = ascending, -1 = descending

  function timeToMinutes(t) {
    var parts = String(t).split(":");
    return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
  }

  function compare(a, b) {
    var res;
    if (sortKey === "time") {
      res = timeToMinutes(a.time) - timeToMinutes(b.time);
    } else {
      res = String(a[sortKey]).toLowerCase().localeCompare(String(b[sortKey]).toLowerCase());
    }
    return res * sortDir;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function render() {
    var q = filterEl.value.trim().toLowerCase();
    var rows = FLIGHTS.filter(function (f) {
      if (!q) return true;
      return f.flight.toLowerCase().indexOf(q) !== -1 ||
             f.city.toLowerCase().indexOf(q) !== -1;
    });
    rows.sort(compare);

    tbody.innerHTML = "";
    if (rows.length === 0) {
      var tr = document.createElement("tr");
      tr.className = "empty";
      var td = document.createElement("td");
      td.colSpan = 5;
      td.textContent = "No flights match your filter.";
      tr.appendChild(td);
      tbody.appendChild(tr);
    } else {
      var html = "";
      rows.forEach(function (f) {
        html += '<tr data-flight="' + escapeHtml(f.flight) + '">' +
          '<td class="flight">' + escapeHtml(f.flight) + '</td>' +
          '<td class="city">' + escapeHtml(f.city) + '</td>' +
          '<td class="time">' + escapeHtml(f.time) + '</td>' +
          '<td class="gate">' + escapeHtml(f.gate) + '</td>' +
          '<td class="status"><span class="chip" data-status="' + escapeHtml(f.status) + '">' +
            escapeHtml(f.status) + '</span></td>' +
        '</tr>';
      });
      tbody.innerHTML = html;
    }

    var n = rows.length;
    countEl.textContent = n + (n === 1 ? " flight" : " flights");

    headers.forEach(function (th) {
      var key = th.getAttribute("data-key");
      var arrow = th.querySelector(".arrow");
      if (key === sortKey) {
        th.setAttribute("aria-sort", sortDir === 1 ? "ascending" : "descending");
        if (arrow) arrow.textContent = sortDir === 1 ? "▲" : "▼";
      } else {
        th.removeAttribute("aria-sort");
        if (arrow) arrow.textContent = "";
      }
    });
  }

  headers.forEach(function (th) {
    th.addEventListener("click", function () {
      var key = th.getAttribute("data-key");
      if (key === sortKey) {
        sortDir = -sortDir;
      } else {
        sortKey = key;
        sortDir = 1;
      }
      render();
    });
  });

  filterEl.addEventListener("input", render);

  render();
})();
</script>
</body>
</html>
